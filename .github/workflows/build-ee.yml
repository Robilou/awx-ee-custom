name: Build EE image

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'execution-environment/**'
      - '.github/workflows/build-ee.yml'
  # main is not built on push: a release is the v*.*.* tag on main, which
  # produces vX.Y.Z + latest + <sha> in one build (no duplicate build).
  push:
    branches: [develop]
    tags: ['v*.*.*']
    paths:
      - 'execution-environment/**'
      - '.github/workflows/build-ee.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional, overrides automatic tagging)'
        required: false

env:
  IMAGE: ghcr.io/robilou/awx-ee-custom
  # BuildKit layer cache in GHCR (registry cache, not type=gha: GHA cache is
  # scoped per branch, so tag builds could not reuse layers built on develop).
  CACHE_REF: ghcr.io/robilou/awx-ee-custom:buildcache

concurrency:
  group: build-ee-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on PRs targeting main/develop. Only builds (no push) so it can be
  # wired up as a required status check in branch protection before merge.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the layer cache from GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Generate build context
        run: ansible-builder create -f execution-environment/execution-environment.yml -c build-context

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Containerfile
          push: false
          # read-only: PR builds must not overwrite the shared cache
          cache-from: type=registry,ref=${{ env.CACHE_REF }}

  # Runs on push to develop (after merge), on v*.*.* release tags and on manual dispatch.
  # Builds and pushes the image to GHCR.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Generate build context
        run: ansible-builder create -f execution-environment/execution-environment.yml -c build-context

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS=()

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS+=("${{ github.event.inputs.tag }}")
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Release: version tag + latest + commit sha in one build
            TAGS+=("${GITHUB_REF#refs/tags/}" "latest" "${SHORT_SHA}")
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAGS+=("dev" "dev-${SHORT_SHA}")
          fi

          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "::error::No image tag determined for ref '${{ github.ref }}'. Use workflow_dispatch with an explicit 'tag' input on branches other than develop (releases are built from v*.*.* tags)." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "${IMAGE}:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          # mode=max caches all intermediate stages of the ansible-builder
          # multi-stage Containerfile (base, galaxy, builder), not only the final one
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max
