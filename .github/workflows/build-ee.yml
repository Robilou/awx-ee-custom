name: Build EE image

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'execution-environment/**'
  push:
    branches: [develop, main]
    paths:
      - 'execution-environment/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional, overrides automatic tagging)'
        required: false

concurrency:
  group: build-ee-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on PRs targeting main/develop. Only builds (no push) so it can be
  # wired up as a required status check in branch protection before merge.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Generate build context
        run: ansible-builder create -f execution-environment/execution-environment.yml -c build-context

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: build-context
          push: false

  # Runs on push to develop/main (i.e. after merge) and on manual dispatch.
  # Builds and pushes the image to GHCR.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-builder
        run: pip install ansible-builder

      - name: Generate build context
        run: ansible-builder create -f execution-environment/execution-environment.yml -c build-context

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS=()

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS+=("${{ github.event.inputs.tag }}")
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAGS+=("dev" "dev-${SHORT_SHA}")
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=("latest" "${SHORT_SHA}")
          fi

          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "::error::No image tag determined for ref '${{ github.ref }}'. Use workflow_dispatch with an explicit 'tag' input on branches other than develop/main." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "ghcr.io/robilou/awx-ee-custom:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-context
          push: true
          tags: ${{ steps.tags.outputs.tags }}
